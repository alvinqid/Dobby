name: Dobby CMake Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobby-cmake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            api: 19
          - abi: arm64-v8a
            api: 21
          - abi: x86
            api: 19
          - abi: x86_64
            api: 21
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Configure with CMake
        shell: bash
        run: |
          cmake -S . -B "build/android-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.api }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPlugin.SymbolResolver=ON

      - name: Build shared and static libraries
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR="build/android-${{ matrix.abi }}"
          cmake --build "${BUILD_DIR}" --verbose --parallel 2 --target dobby dobby_static 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Upload Android build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dobby-build-log-android-${{ matrix.abi }}
          path: build/android-${{ matrix.abi }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Android binaries
        shell: bash
        run: |
          ABI="${{ matrix.abi }}"
          BUILD_DIR="build/android-${ABI}"
          mkdir -p "dist/include" "dist/lib/${ABI}"
          cp include/dobby.h dist/include/
          cp LICENSE README.md dist/
          cp "${BUILD_DIR}/libdobby.so" "${BUILD_DIR}/libdobby.a" "dist/lib/${ABI}/"
          {
            echo "platform=android"
            echo "abi=${ABI}"
            echo "api_level=${{ matrix.api }}"
            echo "build_type=Release"
            echo "libraries=libdobby.so,libdobby.a"
          } > dist/BUILD_INFO.txt
          file "dist/lib/${ABI}/libdobby.so" "dist/lib/${ABI}/libdobby.a"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-android-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            processor: x86_64
            cc: gcc
            cxx: g++
            packages: build-essential
          - arch: x86
            processor: i686
            cc: i686-linux-gnu-gcc
            cxx: i686-linux-gnu-g++
            packages: gcc-i686-linux-gnu g++-i686-linux-gnu
          - arch: arm
            processor: arm
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          - arch: aarch64
            processor: aarch64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.packages }}

      - name: Configure with CMake
        run: |
          cmake -S . -B "build/linux-${{ matrix.arch }}" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR="${{ matrix.processor }}" \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPlugin.SymbolResolver=ON

      - name: Build shared and static libraries
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR="build/linux-${{ matrix.arch }}"
          cmake --build "${BUILD_DIR}" --verbose --parallel 2 --target dobby dobby_static 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dobby-build-log-linux-${{ matrix.arch }}
          path: build/linux-${{ matrix.arch }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Linux binaries
        shell: bash
        run: |
          ARCH="${{ matrix.arch }}"
          BUILD_DIR="build/linux-${ARCH}"
          mkdir -p dist/include "dist/lib/${ARCH}"
          cp include/dobby.h dist/include/
          cp LICENSE README.md dist/
          cp "${BUILD_DIR}/libdobby.so" "${BUILD_DIR}/libdobby.a" "dist/lib/${ARCH}/"
          {
            echo "platform=linux"
            echo "architecture=${ARCH}"
            echo "build_type=Release"
            echo "libraries=libdobby.so,libdobby.a"
          } > dist/BUILD_INFO.txt
          file "dist/lib/${ARCH}/libdobby.so" "dist/lib/${ARCH}/libdobby.a"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  apple:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x86_64
            processor: x86_64
            deployment_target: "10.15"
          - platform: macos
            arch: arm64
            processor: arm64
            deployment_target: "11.0"
          - platform: iphoneos
            arch: arm64
            processor: arm64
            deployment_target: "12.0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure with CMake
        shell: bash
        run: |
          BUILD_DIR="build/${{ matrix.platform }}-${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "iphoneos" ]]; then
            cmake -S . -B "${BUILD_DIR}" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
              -DCMAKE_SYSTEM_PROCESSOR="${{ matrix.processor }}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DDOBBY_DEBUG=OFF \
              -DDOBBY_BUILD_EXAMPLE=OFF \
              -DDOBBY_BUILD_TEST=OFF \
              -DPlugin.SymbolResolver=ON
          else
            cmake -S . -B "${BUILD_DIR}" \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
              -DCMAKE_SYSTEM_PROCESSOR="${{ matrix.processor }}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DDOBBY_DEBUG=OFF \
              -DDOBBY_BUILD_EXAMPLE=OFF \
              -DDOBBY_BUILD_TEST=OFF \
              -DPlugin.SymbolResolver=ON
          fi

      - name: Build shared and static libraries
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR="build/${{ matrix.platform }}-${{ matrix.arch }}"
          cmake --build "${BUILD_DIR}" --verbose --parallel 3 --target dobby dobby_static 2>&1 | tee "${BUILD_DIR}/build.log"

      - name: Upload Apple build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dobby-build-log-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/${{ matrix.platform }}-${{ matrix.arch }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Apple binaries
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"
          BUILD_DIR="build/${PLATFORM}-${ARCH}"
          mkdir -p dist/include "dist/lib/${PLATFORM}/${ARCH}"
          cp include/dobby.h dist/include/
          cp LICENSE README.md dist/
          cp "${BUILD_DIR}/libdobby.dylib" "${BUILD_DIR}/libdobby.a" "dist/lib/${PLATFORM}/${ARCH}/"
          {
            echo "platform=${PLATFORM}"
            echo "architecture=${ARCH}"
            echo "deployment_target=${{ matrix.deployment_target }}"
            echo "build_type=Release"
            echo "libraries=libdobby.dylib,libdobby.a"
          } > dist/BUILD_INFO.txt
          file "dist/lib/${PLATFORM}/${ARCH}/libdobby.dylib" "dist/lib/${PLATFORM}/${ARCH}/libdobby.a"

      - name: Upload Apple artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
